            </ul>
        </nav>
    </header>

    <main>
        <section class="page-hero">
            <h1>Hubungi Kami</h1>
            <p>Formulir di bawah ini dapat diisi untuk pertanyaan dan pesan seputar akademik.</p>
        </section>

        <section class="page-section">
            <form class="form-kontak" action="https://formspree.io/f/GANTI_DENGAN_ID_ANDA" method="POST">
                <input type="hidden" name="_subject" value="Pesan baru dari website SMA Kristen Petra 4">
                <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="form-grid">
                    <div class="field">
                        <label for="nama">Nama lengkap <span class="wajib" aria-hidden="true">*</span></label>
                        <input type="text" id="nama" name="nama" placeholder="Nama Anda" autocomplete="name" required>
                    </div>

                    <div class="field">
                        <label for="email">Email <span class="wajib" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label for="telepon">Nomor HP / WhatsApp <span class="wajib" aria-hidden="true">*</span></label>
                        <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" inputmode="tel" autocomplete="tel" pattern="[0-9+\s\-]{8,16}" title="Masukkan 8–16 digit angka" required>
                    </div>

                    <div class="field">
                        <label for="domisili">Domisili <span class="wajib" aria-hidden="true">*</span></label>
                        <input type="text" id="domisili" name="domisili" placeholder="Kota / kabupaten" autocomplete="address-level2" required>
                    </div>

                    <div class="field">
                        <label for="status">Anda adalah <span class="wajib" aria-hidden="true">*</span></label>
                        <select id="status" name="status" required>
                            <option value="" selected disabled>Pilih salah satu</option>
                            <option>Calon siswa</option>
                            <option>Orang tua / wali</option>
                            <option>Siswa</option>
                            <option>Alumni</option>
                            <option>Lainnya</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="topik">Topik pesan <span class="wajib" aria-hidden="true">*</span></label>
                        <select id="topik" name="topik" required>
                            <option value="" selected disabled>Pilih salah satu</option>
                            <option>Informasi pendaftaran</option>
                            <option>Jurusan dan kurikulum</option>
                            <option>Biaya pendidikan</option>
                            <option>Kunjungan sekolah</option>
                            <option>Kerja sama</option>
                            <option>Lainnya</option>
                        </select>
                    </div>

                    <div class="field field-penuh">
                        <label for="pesan">Pesan <span class="wajib" aria-hidden="true">*</span></label>
                        <textarea id="pesan" name="pesan" rows="6" maxlength="1000" placeholder="Tulis pertanyaan atau pesan Anda di sini" required></textarea>
                    </div>

                    <div class="field field-penuh field-cek">
                        <input type="checkbox" id="setuju" name="setuju" value="ya" required>
                        <label for="setuju">Saya setuju data yang saya isi digunakan untuk menanggapi pesan ini.</label>
                    </div>
                </div>

                <button type="submit">Kirim pesan</button>
            </form>
        </section>
    </main>
