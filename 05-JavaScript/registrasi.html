    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 16px;
        background: #f3f4f6;
        font-family: Arial, Helvetica, sans-serif;
        color: #444;
      }

      .card {
        max-width: 440px;
        margin: 0 auto;
        background: #fff;
        padding: 24px 30px 30px;
        border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
      }

      h1 {
        text-align: center;
        font-size: 22px;
        color: #222;
        margin: 0 0 18px;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 15px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        font-size: 13px;
        border: 1px solid #d0d5dd;
        border-radius: 4px;
        background: #fff;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #0b5aa8;
      }

      .error {
        color: #c0392b;
        font-size: 12px;
        margin-top: 4px;
        min-height: 0;
      }

      .invalid {
        border-color: #c0392b;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: #0b5aa8;
        color: #fff;
        font-size: 15px;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background: #094a8a;
      }

      .field {
        position: relative;
      }

      .saran {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        z-index: 5;
        background: #fff;
        border: 1px solid #d0d5dd;
        border-top: 0;
        border-radius: 0 0 4px 4px;
        max-height: 180px;
        overflow-y: auto;
        display: none;
      }

      .saran div {
        padding: 8px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      .saran div:hover {
        background: #eef3fa;
      }

      .saran small {
        color: #888;
        margin-left: 6px;
      }

      .sukses {
        display: none;
        margin-top: 16px;
        padding: 10px;
        background: #eaf6ec;
        color: #256c35;
        border-radius: 4px;
        font-size: 14px;
      }

      .nav {
        max-width: 440px;
        margin: 16px auto 0;
        padding: 12px;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        display: flex;
        gap: 8px;
      }

      .nav a {
        flex: 1;
        text-align: center;
        padding: 10px;
        font-size: 14px;
        color: #0b5aa8;
        text-decoration: none;
        border: 1px solid #0b5aa8;
        border-radius: 4px;
      }

      .nav a:hover {
        background: #0b5aa8;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Registrasi Mahasiswa</h1>
      <form id="form" novalidate>
        <label for="nama">Nama Mahasiswa</label>
        <div class="field">
          <input type="text" id="nama" placeholder="Masukkan Nama" autocomplete="off">
          <div class="saran" id="saran"></div>
        </div>
        <div class="error" id="err-nama"></div>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Email Aktif">
        <div class="error" id="err-email"></div>

        <label for="nrp">NRP</label>
        <input type="text" id="nrp" placeholder="Masukkan NRP" maxlength="10" inputmode="numeric">
        <div class="error" id="err-nrp"></div>

        <label for="matkul">Mata Kuliah</label>
        <input type="text" id="matkul" placeholder="Masukkan Mata Kuliah">
        <div class="error" id="err-matkul"></div>

        <label for="dosen">Dosen Pengampu</label>
        <input type="text" id="dosen" placeholder="Masukkan Nama Dosen">
        <div class="error" id="err-dosen"></div>

        <button type="submit">Submit</button>
      </form>
      <div class="sukses" id="sukses">Registrasi berhasil disimpan.</div>
    </div>

      const inputNama = document.getElementById("nama");
      const inputNrp = document.getElementById("nrp");
      const saran = document.getElementById("saran");
      inputNama.addEventListener("input", () => {
        const kata = inputNama.value.trim().toLowerCase();
        saran.innerHTML = "";
        if (!kata) {
          saran.style.display = "none";
          return;
        }
        const cocok = dataMahasiswa.filter(m => m.nama.toLowerCase().includes(kata)).slice(0, 8);
        if (cocok.length === 0) {
          saran.style.display = "none";
          return;
        }
        cocok.forEach(m => {
          const item = document.createElement("div");
          item.innerHTML = m.nama + "<small>" + m.nrp + "</small>";
          item.addEventListener("click", () => {
            inputNama.value = m.nama;
            inputNrp.value = m.nrp;
            saran.style.display = "none";
          });
          saran.appendChild(item);
        });
        saran.style.display = "block";
      });
      document.addEventListener("click", e => {
        if (!e.target.closest(".field")) saran.style.display = "none";
      });

      function setError(id, pesan) {
        document.getElementById("err-" + id).textContent = pesan;
        document.getElementById(id).classList.toggle("invalid", pesan !== "");
        return pesan === "";
      }
      document.getElementById("form").addEventListener("submit", e => {
        e.preventDefault();
        const nama = inputNama.value.trim();
        const email = document.getElementById("email").value.trim();
        const nrp = inputNrp.value.trim();
        const matkul = document.getElementById("matkul").value.trim();
        const dosen = document.getElementById("dosen").value.trim();
        let valid = true;
        valid = setError("nama", nama ? "" : "Nama tidak boleh kosong") && valid;
        valid = setError("email", !email ? "Email tidak boleh kosong" : !email.includes("@") ? "Email harus mengandung @" : "") && valid;
        valid = setError("nrp", /^\d{10}$/.test(nrp) ? "" : "NRP harus 10 digit angka") && valid;
        valid = setError("matkul", matkul ? "" : "Mata kuliah tidak boleh kosong") && valid;
        valid = setError("dosen", dosen ? "" : "Nama dosen tidak boleh kosong") && valid;
        document.getElementById("sukses").style.display = valid ? "block" : "none";
      });
