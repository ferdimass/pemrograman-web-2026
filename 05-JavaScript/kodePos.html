    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 16px;
        background: #f3f4f6;
        font-family: Arial, Helvetica, sans-serif;
        color: #444;
      }

      .card {
        max-width: 440px;
        margin: 0 auto;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        overflow: hidden;
      }

      .header {
        background: #e6edf7;
        color: #1f3a5f;
        font-weight: bold;
        font-size: 18px;
        padding: 16px 30px;
      }

      .isi {
        padding: 8px 30px 30px;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 15px;
      }

      select {
        width: 100%;
        padding: 10px;
        font-size: 13px;
        border: 1px solid #d0d5dd;
        border-radius: 4px;
        background: #fff;
      }

      select:focus {
        outline: none;
        border-color: #0b5aa8;
      }

      select:disabled {
        background: #f3f4f6;
        color: #999;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: #0b5aa8;
        color: #fff;
        font-size: 15px;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background: #094a8a;
      }

      .hasil {
        margin-top: 20px;
      }

      .hasil h2 {
        font-size: 16px;
        color: #222;
        margin: 0 0 10px;
      }

      .item {
        border: 1px solid #d0d5dd;
        border-radius: 4px;
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 14px;
        background: #f8fafc;
      }

      .item b {
        color: #0b5aa8;
      }

      .error {
        color: #c0392b;
        font-size: 13px;
        margin-top: 12px;
      }

      .nav {
        max-width: 440px;
        margin: 16px auto 0;
        padding: 12px;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        display: flex;
        gap: 8px;
      }

      .nav a {
        flex: 1;
        text-align: center;
        padding: 10px;
        font-size: 14px;
        color: #0b5aa8;
        text-decoration: none;
        border: 1px solid #0b5aa8;
        border-radius: 4px;
      }

      .nav a:hover {
        background: #0b5aa8;
        color: #fff;
      }
    </style>
  </head>

      const selProv = document.getElementById("provinsi");
      const selKota = document.getElementById("kota");
      const selKec = document.getElementById("kecamatan");
      const output = document.getElementById("output");

      function isiOpsi(select, daftar, placeholder) {
        select.innerHTML = '<option value="">' + placeholder + '</option>';
        daftar.forEach(n => {
          const opt = document.createElement("option");
          opt.value = n;
          opt.textContent = n;
          select.appendChild(opt);
        });
        select.disabled = daftar.length === 0;
      }

      function resetKecamatan() {
        isiOpsi(selKec, [], "Pilih Kecamatan");
      }
      isiOpsi(selProv, Object.keys(dataWilayah), "Pilih Provinsi");
      selProv.addEventListener("change", () => {
        output.innerHTML = "";
        resetKecamatan();
        const kota = dataWilayah[selProv.value] ? Object.keys(dataWilayah[selProv.value]) : [];
        isiOpsi(selKota, kota, "Pilih Kota atau Kabupaten");
      });
      selKota.addEventListener("change", () => {
        output.innerHTML = "";
        const kec = selKota.value ? Object.keys(dataWilayah[selProv.value][selKota.value]) : [];
        isiOpsi(selKec, kec, "Pilih Kecamatan");
      });
      selKec.addEventListener("change", () => {
        output.innerHTML = "";
      });
      document.getElementById("cari").addEventListener("click", () => {
        if (!selProv.value || !selKota.value || !selKec.value) {
          output.innerHTML = '<div class="error">Pilih provinsi, kota atau kabupaten, dan kecamatan terlebih dahulu.</div>';
          return;
        }
        const daftar = dataWilayah[selProv.value][selKota.value][selKec.value];
        let html = '<div class="hasil"><h2>Hasil Pencarian</h2>';
        daftar.forEach(d => {
          html += '<div class="item">Kode pos <b>' + d.kodepos + '</b> untuk daerah Kelurahan ' + d.kelurahan +
            ', Kecamatan ' + selKec.value + ', ' + selKota.value + ', ' + selProv.value + '.</div>';
        });
        output.innerHTML = html + "</div>";
      });
