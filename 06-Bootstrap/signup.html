<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .signup {
            min-height: 100vh;
        }

        .signup-container {
            max-width: 650px;
            width: 100%;
            margin: auto;
            padding: 40px 30px;
        }

        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 25px;
        }

        .signup-heading {
            font-weight: 600;
            color: #212529;
        }

        .form-control {
            padding: 12px;
        }

        .btn-custom {
            padding: 12px;
            font-weight: bold;
        }

        .terms-text {
            font-size: 14px;
            color: #6c757d;
        }
        </style>
    </head>

    <body>

        <div class="container-fluid">
        <div class="row">

            <!-- Left Image -->
            <div class="d-none d-md-block col-md-4 col-lg-5 bg-image"></div>

            <!-- Signup Form -->
            <div class="col-12 col-md-8 col-lg-7">
            <div class="signup d-flex align-items-center py-4">
                <div class="signup-container">

                <div class="signup-box">

                    <h2 class="signup-heading mb-2">
                    Create an account
                    </h2>

                    <p class="text-secondary mb-4">
                    Register a new account below.
                    </p>

                    <form action="#" method="post">
                    <div class="row">

                        <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">
                            First Name
                        </label>
                        <input type="text" class="form-control" id="firstName" placeholder="First name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">
                            Last Name
                        </label>
                        <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="displayName" class="form-label">
                        Display Name
                        </label>
                        <input type="text" class="form-control" id="displayName" placeholder="Enter your display name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                        Email address
                        </label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        </div>

                        <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
                        </div>

                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="agreeTerms" required>

                        <label class="form-check-label" for="agreeTerms">
                        <strong>I Agree</strong>
                        </label>

                        <p class="terms-text mt-2 mb-0">
                        By clicking Register, you agree to the
                        Terms and Conditions set out by this site,
                        including our Cookie Use.
                        </p>
                    </div>

                    <div class="row g-2">

                        <div class="col-12 col-md-6">
                        <button type="submit" class="btn btn-success btn-custom w-100">
                            Register
                        </button>
                        </div>

                        <div class="col-12 col-md-6">
                        <a href="login.html" class="btn btn-outline-primary btn-custom w-100">
                            Sign In
                        </a>
                        </div>

                    </div>

                    </form>

                </div>

                </div>
            </div>
            </div>

        </div>
        </div>

    </body>

</html>
