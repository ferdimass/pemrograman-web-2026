<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .login {
            min-height: 100vh;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            margin: auto;
            padding: 30px;
        }

        .login-heading {
            font-weight: 600;
            color: #212529;
        }

        .form-control {
            padding: 12px;
        }

        .btn-login {
            padding: 12px;
            font-weight: bold;
        }
        </style>
    </head>

    <body>

        <div class="container-fluid">
        <div class="row">

            <!-- Left Image -->
            <div class="d-none d-md-block col-md-4 col-lg-5 bg-image"></div>

            <!-- Login Form -->
            <div class="col-12 col-md-8 col-lg-7">
            <div class="login d-flex align-items-center py-5">
                <div class="login-container">

                <h2 class="login-heading mb-2">Welcome back!</h2>
                <p class="text-secondary mb-4">
                    Sign in to your account.
                </p>

                <form action="#" method="post">

                    <div class="mb-3">
                    <label for="email" class="form-label">
                        Email address
                    </label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="rememberPassword">
                    <label class="form-check-label" for="rememberPassword">
                        Remember password
                    </label>
                    </div>

                    <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg btn-login">
                        Sign In
                    </button>
                    </div>

                </form>

                <hr>

                <p class="text-center mb-2">
                    Don't have an account?
                </p>

                <div class="d-grid">
                    <a href="signup.html" class="btn btn-outline-primary btn-login">
                    Sign Up
                    </a>
                </div>

                </div>
            </div>
            </div>

        </div>
        </div>

    </body>

</html>
